<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oura S-1 Model</title>
<meta name="description" content="A driver-based model of Oura Inc. built from its September 2026 Form S-1: business drivers, unit economics, warranty analysis, financials, DCF and comparables.">
<meta property="og:title" content="Oura S-1 Model">
<meta property="og:description" content="Driver-based model built from Oura's Form S-1. Business drivers, unit economics, warranty analysis, financials, DCF and comparables. Every assumption editable.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1b222b; --muted:#717b87; --faint:#9aa3ae;
    --line:#e7eaef; --line2:#eef1f5; --accent:#2563eb; --accent-soft:#eef3ff;
    --teal:#0f9d8c; --good:#1f9d57; --warn:#c2410c; --gold:#b7791f;
    --shadow:0 1px 2px rgba(20,30,45,.04),0 2px 8px rgba(20,30,45,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  /* top bar */
  .top{height:54px;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--panel);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .brand{font-weight:700;font-size:15px;letter-spacing:-.2px;color:inherit;text-decoration:none}
  .brand:hover{color:var(--accent)}
  .brand small{font-weight:500;color:var(--muted);margin-left:8px;font-size:12px}
  .company{margin-left:2px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;color:var(--ink)}
  .scenarios{margin-left:auto;display:flex;gap:6px;align-items:center}
  .scenarios span{color:var(--faint);font-size:11px;margin-right:2px;text-transform:uppercase;letter-spacing:.5px}
  .sbtn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:5px 11px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500}
  .sbtn:hover{border-color:#cdd4dd;background:#fafbfc}
  .sbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .sbtn.primary[disabled]{background:#9bb7f5;border-color:#9bb7f5}
  .sbtn.ghost{color:var(--muted)}
  .sbtn[disabled]{opacity:.45;cursor:default}
  .scnsel{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .scnsel button{border:0;border-right:1px solid var(--line);background:#fff;padding:6px 13px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
  .scnsel button:last-child{border-right:0}
  .scnsel button:hover{background:#f7f9fc}
  .scnsel button.active{background:var(--accent);color:#fff}
  .dirty{font-size:11px;font-weight:600;margin:0 2px;white-space:nowrap}
  .dirty.on{color:var(--warn)} .dirty.off{color:var(--good)}
  /* layout */
  .app{display:grid;grid-template-columns:296px 1fr 326px;height:calc(100vh - 54px)}
  .rail{overflow-y:auto;background:var(--panel)}
  .rail.left{border-right:1px solid var(--line)}
  .rail.right{border-left:1px solid var(--line)}
  .center{overflow-y:auto;padding:0}
  .rail-head{padding:14px 16px 8px;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);position:sticky;top:0;background:var(--panel);z-index:5}
  /* assumption groups */
  details.grp{border-bottom:1px solid var(--line2)}
  details.grp>summary{list-style:none;cursor:pointer;padding:9px 16px;font-weight:600;font-size:12px;color:var(--ink);display:flex;align-items:center;gap:7px;user-select:none}
  details.grp>summary::-webkit-details-marker{display:none}
  details.grp>summary .chev{color:var(--faint);transition:transform .15s;font-size:10px}
  details.grp[open]>summary .chev{transform:rotate(90deg)}
  details.grp>summary .rel{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0}
  details.grp.relevant>summary .rel{opacity:1}
  details.grp.relevant>summary{color:var(--accent)}
  .grp-body{padding:2px 16px 12px}
  .inp{margin:8px 0}
  .inp label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
  .inwrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fcfcfd}
  .inwrap:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .inwrap input{flex:1;border:0;background:transparent;padding:6px 8px;font-size:12.5px;color:var(--ink);width:100%;outline:none;font-variant-numeric:tabular-nums}
  .inwrap .unit{padding:0 9px;color:var(--faint);font-size:11px;border-left:1px solid var(--line)}
  .inp .lab{display:flex;align-items:center;gap:6px;margin-bottom:3px}
  .inp .lab label{margin:0}
  .inp .info{margin-left:auto;width:15px;height:15px;border-radius:50%;border:1px solid var(--line);color:var(--faint);font-size:10px;line-height:13px;text-align:center;cursor:pointer;flex:none;font-style:italic;font-family:Georgia,'Times New Roman',serif}
  .inp .info:hover{border-color:var(--accent);color:var(--accent)}
  .inp .info.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .rat{display:none;margin:5px 0 2px;padding:8px 10px;background:#f7f9fc;border:1px solid var(--line2);border-radius:7px;font-size:11px;color:var(--muted);line-height:1.5;cursor:text}
  .rat.show{display:block}
  .rat .edit-hint{display:block;font-size:9.5px;color:var(--faint);margin-top:6px}
  .rat .empty{font-style:italic;color:var(--faint)}
  .rat textarea{width:100%;min-height:64px;border:1px solid var(--accent);border-radius:6px;padding:6px;font:inherit;font-size:11px;color:var(--ink);line-height:1.5;background:#fff;outline:none}
  /* center / tabs */
  .tabbar{display:flex;gap:2px;padding:12px 22px 0;position:sticky;top:0;background:var(--bg);z-index:6;border-bottom:1px solid var(--line)}
  .tab{padding:9px 16px;border:0;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .body{padding:20px 22px 60px;max-width:760px}
  h2.sec{font-size:15px;margin:4px 0 2px;letter-spacing:-.2px}
  p.lede{color:var(--muted);margin:0 0 16px;font-size:12.5px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 20px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow)}
  .kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin-bottom:5px}
  .kpi .v{font-size:19px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:16px 0;box-shadow:var(--shadow)}
  .card h3{margin:0 0 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card h3 .pill{font-size:10px;font-weight:600;color:var(--muted);background:#f1f3f6;padding:2px 7px;border-radius:20px;letter-spacing:.3px}
  table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  table.t th,table.t td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line2);font-size:12px}
  table.t th:first-child,table.t td:first-child{text-align:left;color:var(--ink)}
  table.t tr:last-child td{border-bottom:0}
  table.t td{color:#33404e}
  table.t tr.tot td,table.t tr.tot th{font-weight:700;border-top:2px solid var(--line);color:var(--ink)}
  table.t .hd td{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  table.t .muted td{color:var(--muted)}
  /* bars */
  .bars{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .bar-row{display:grid;grid-template-columns:96px 1fr 78px;align-items:center;gap:10px}
  .bar-label{font-size:12px;color:var(--ink)}
  .bar-track{height:16px;background:#f0f2f5;border-radius:5px;overflow:hidden}
  .bar-fill{height:100%;border-radius:5px}
  .bar-val{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:#33404e}
  .chart{width:100%;height:auto;display:block}
  .legend{display:flex;gap:16px;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .funnel{display:flex;flex-direction:column;gap:4px}
  .fstep{display:flex;justify-content:space-between;align-items:center;padding:7px 11px;border-radius:7px;font-size:12px}
  .fstep .fl{color:#33404e}.fstep .fv{font-weight:600;font-variant-numeric:tabular-nums}
  /* right rail notes */
  .takeaways{padding:6px 16px 4px}
  .takeaways ul{margin:0;padding-left:16px}
  .takeaways li{margin:7px 0;font-size:12.5px;color:#33404e}
  .takeaways li b{color:var(--ink)}
  .notes-block{padding:8px 16px 20px}
  .notes-block label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:8px;margin:10px 0 6px}
  .notes-block textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;font-size:12.5px;resize:vertical;background:#fcfcfd;color:var(--ink);line-height:1.5}
  .notes-block textarea:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .saved{font-size:10.5px;color:var(--good);opacity:0;transition:opacity .3s;font-weight:600}
  .saved.show{opacity:1}
  .flag{color:var(--warn)} .ok{color:var(--good)}
  .disclaimer{font-size:11px;color:var(--faint);margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  p.note{font-size:11.5px;color:var(--muted);margin:11px 0 0;line-height:1.55}
  .src{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
  <div class="top">
    <a class="brand" href="../" title="All projects">&#8592; Financial Dashboards<small>driver-based modelling</small></a>
    <select class="company" id="company"><option>Company</option></select>
    <div class="scenarios">
      <span>Scenario</span>
      <div class="scnsel" id="scnsel">
        <button data-scn="base">Base</button>
        <button data-scn="bull">Bull</button>
        <button data-scn="bear">Bear</button>
      </div>
      <span class="dirty off" id="dirty">● Saved</span>
      <button class="sbtn" id="btnRevert" title="Discard edits since your last save-down">Revert</button>
      <button class="sbtn primary" id="btnSave" title="Make the current assumptions the new revert point">Save down</button>
      <button class="sbtn ghost" id="btnReset" title="Reset this scenario to its template defaults">Reset</button>
    </div>
  </div>
  <div class="app">
    <aside class="rail left"><div class="rail-head">Assumptions</div><div id="inputs"></div></aside>
    <main class="center">
      <div class="tabbar" id="tabbar"></div>
      <div class="body" id="body"></div>
    </main>
    <aside class="rail right">
      <div class="rail-head" id="notesHead">Notes &amp; Takeaways</div>
      <div class="takeaways" id="takeaways"></div>
      <div class="notes-block">
        <label>Your notes <span class="saved" id="saved">saved</span></label>
        <textarea id="notes" placeholder="Add your own commentary for this tab. Auto-saves locally."></textarea>
      </div>
    </aside>
  </div>

<script>
/* ============================================================
   REUSABLE SHELL: a model = { id, name, groups, defaults, presets, compute, tabs }
   Add another company by defining MODELS.<id> with the same shape.
   ============================================================ */

// ---- formatting helpers ----
const money = v => { const n=Math.abs(v), s=v<0?'-':''; if(n>=1e9) return s+'$'+(n/1e9).toFixed(2)+'B'; if(n>=1e6) return s+'$'+(n/1e6).toFixed(1)+'M'; return s+'$'+Math.round(n).toLocaleString(); };
const money0 = v => '$'+Math.round(v).toLocaleString();
const int = v => Math.round(v).toLocaleString();
const pct = v => (Math.round(v*1000)/10)+'%';
const xx  = v => (isFinite(v)? v.toFixed(1):'∞')+'x';

// ===== BEGIN MODEL — authored per build (see the financial-dashboard skill) =====
const MODELS = {};
let ACTIVE_COMPANY = null;
/* ============================================================================
   OURA INC. (Nasdaq: OURA) — driver-based model off the Form S-1 filed 3 Sep 2026
   All figures $ millions unless stated. Fiscal year ends 30 September.
   ============================================================================ */

// ---------- local formatters (shell's money() expects raw $; we work in $M) ----------
const mm  = v => { const n=Math.abs(v), s=v<0?'-':''; return n>=1000 ? s+'$'+(n/1000).toFixed(2)+'B' : s+'$'+n.toFixed(0)+'M'; };
const mm1 = v => { const n=Math.abs(v), s=v<0?'-':''; return n>=1000 ? s+'$'+(n/1000).toFixed(2)+'B' : s+'$'+n.toFixed(1)+'M'; };
const d0  = v => '$'+Math.round(v).toLocaleString();
const d2  = v => '$'+v.toFixed(2);
const p0  = v => (v*100).toFixed(0)+'%';
const p1  = v => (v*100).toFixed(1)+'%';
const u1  = v => v.toFixed(1)+'M';
const u2  = v => v.toFixed(2)+'M';
const mult= v => (isFinite(v)&&v>0 ? v.toFixed(1) : 'nm')+'x';
const dSg = v => (v<0?'-':'+')+'$'+Math.abs(Math.round(v)).toLocaleString();

// ---------- wide tables scroll sideways with the label column pinned ----------
const tbl = rows => '<div class="tscroll at-left">'+table(rows)+'</div>';
document.addEventListener('scroll', e => {
  const d = e.target; if(!d.classList || !d.classList.contains('tscroll')) return;
  d.classList.toggle('at-left', d.scrollLeft < 2);
}, true);
document.head.insertAdjacentHTML('beforeend', `<style>
  .tscroll{overflow-x:auto;overflow-y:visible;margin:0 -2px;padding-bottom:2px}
  .tscroll table.t td:not(:first-child){white-space:nowrap}
  .tscroll table.t td:first-child{position:sticky;left:0;background:var(--panel);z-index:2;
    min-width:176px;box-shadow:1px 0 0 var(--line2)}
  .tscroll.at-left table.t td:first-child{box-shadow:1px 0 0 var(--line2)}
  .tscroll:not(.at-left) table.t td:first-child{
    box-shadow:1px 0 0 var(--line2), 7px 0 7px -5px rgba(20,30,45,.16)}
  .tscroll::-webkit-scrollbar{height:9px}
  .tscroll::-webkit-scrollbar-thumb{background:#d8dde4;border-radius:5px}
  .tscroll::-webkit-scrollbar-thumb:hover{background:#c4cbd4}
  .tscroll::-webkit-scrollbar-track{background:transparent}
  td.act{background:#fbfcfd;color:#5a6673}
  .card h3 .pill.act{background:#eef1f5;color:#717b87}
</style>`);

// ---------- chart helpers (annual series, not the shell's month grid) ----------
const CLR = {hw:'#2563eb', mem:'#0f9d8c', line:'#b7791f', neg:'#c2410c', grey:'#9aa3ae', pur:'#7c5cbf'};

function colBars(labels, series, fmt, opts){
  opts = opts||{};
  const W=580, H=opts.h||210, P=46, RP=10, TP=14, BP=26;
  const n=labels.length, k=series.length;
  const stack = !!opts.stack;
  const tot = stack ? labels.map((_,i)=>series.reduce((s,x)=>s+x.data[i],0)) : null;
  const allv = stack ? tot : series.flatMap(s=>s.data);
  let max=Math.max(...allv,0), min=Math.min(...allv,0);
  if(max===min) max=min+1; const span=max-min;
  const y=v=>TP+(H-TP-BP)-((v-min)/span)*(H-TP-BP);
  const slotW=(W-P-RP)/n, pad=slotW*0.18, bw=stack?(slotW-2*pad):((slotW-2*pad)/k);
  const grid=[max,(max+min)/2,min].map(v=>`<line x1="${P}" y1="${y(v).toFixed(1)}" x2="${W-RP}" y2="${y(v).toFixed(1)}" stroke="#eef1f5"/><text x="${P-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#9aa3ae">${fmt(v)}</text>`).join('');
  let bars='';
  labels.forEach((lb,i)=>{
    const x0=P+i*slotW+pad;
    if(stack){
      let acc=0;
      series.forEach(s=>{ const v=s.data[i]; const yTop=y(acc+v), yBot=y(acc);
        bars+=`<rect x="${x0.toFixed(1)}" y="${yTop.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,yBot-yTop).toFixed(1)}" fill="${s.color}" rx="1.5"/>`; acc+=v; });
      if(opts.labelTotals) bars+=`<text x="${(x0+bw/2).toFixed(1)}" y="${(y(acc)-4).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="600" fill="#33404e">${fmt(acc)}</text>`;
    } else {
      series.forEach((s,j)=>{ const v=s.data[i]; const yTop=y(Math.max(v,0)), yBot=y(Math.min(v,0));
        bars+=`<rect x="${(x0+j*bw).toFixed(1)}" y="${yTop.toFixed(1)}" width="${(bw*0.86).toFixed(1)}" height="${Math.max(1,yBot-yTop).toFixed(1)}" fill="${s.color}" rx="1.5"/>`; });
    }
  });
  const xl=labels.map((lb,i)=>`<text x="${(P+i*slotW+slotW/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#9aa3ae">${lb}</text>`).join('');
  const zero=(min<0)?`<line x1="${P}" y1="${y(0).toFixed(1)}" x2="${W-RP}" y2="${y(0).toFixed(1)}" stroke="#cbd2da"/>`:'';
  const leg=opts.noLegend?'':`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${grid}${zero}${bars}${xl}</svg>${leg}`;
}

function lineYr(labels, series, fmt, opts){
  opts=opts||{};
  const W=580,H=opts.h||200,P=46,RP=10,TP=14,BP=26;
  const n=labels.length;
  const all=series.flatMap(s=>s.data.filter(v=>v!==null&&isFinite(v)));
  let max=Math.max(...all), min=opts.zero?Math.min(...all,0):Math.min(...all);
  if(max===min) max=min+1; const pad=(max-min)*0.08; max+=pad; min-=pad; const span=max-min;
  const x=i=>P+(n===1?0:i*(W-P-RP)/(n-1)), y=v=>TP+(H-TP-BP)-((v-min)/span)*(H-TP-BP);
  const grid=[max,(max+min)/2,min].map(v=>`<line x1="${P}" y1="${y(v).toFixed(1)}" x2="${W-RP}" y2="${y(v).toFixed(1)}" stroke="#eef1f5"/><text x="${P-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#9aa3ae">${fmt(v)}</text>`).join('');
  const lines=series.map(s=>{
    const pts=s.data.map((v,i)=>v===null?null:x(i).toFixed(1)+','+y(v).toFixed(1)).filter(Boolean).join(' ');
    const dots=s.data.map((v,i)=>v===null?'':`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="${s.color}"/>`).join('');
    return `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-dasharray="${s.dash||''}" points="${pts}"/>${dots}`;
  }).join('');
  const xl=labels.map((lb,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#9aa3ae">${lb}</text>`).join('');
  const leg=opts.noLegend?'':`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${grid}${lines}${xl}</svg>${leg}`;
}

function fieldChart(rows, refs, fmt){
  const W=580, rowH=30, TP=40, BP=30, H=TP+rows.length*rowH+BP, P=168, RP=14;
  const allv=rows.flatMap(r=>[r.lo,r.hi]).concat(refs.map(r=>r.v));
  let min=Math.min(...allv)*0.9, max=Math.max(...allv)*1.05;
  const x=v=>P+((v-min)/(max-min))*(W-P-RP);
  const ticks=[0,0.25,0.5,0.75,1].map(f=>{const v=min+(max-min)*f;
    return `<line x1="${x(v).toFixed(1)}" y1="${TP-4}" x2="${x(v).toFixed(1)}" y2="${H-BP+4}" stroke="#eef1f5"/><text x="${x(v).toFixed(1)}" y="${H-BP+17}" text-anchor="middle" font-size="9" fill="#9aa3ae">${fmt(v)}</text>`;}).join('');
  const bars=rows.map((r,i)=>{
    const yy=TP+i*rowH+6, h=15;
    const mid=(r.lo+r.hi)/2;
    return `<text x="${P-10}" y="${(yy+11).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#33404e">${r.label}</text>`
      +`<rect x="${x(r.lo).toFixed(1)}" y="${yy}" width="${Math.max(2,x(r.hi)-x(r.lo)).toFixed(1)}" height="${h}" fill="${r.color||'#2563eb'}" opacity="0.82" rx="3"/>`
      +`<text x="${(x(r.lo)-4).toFixed(1)}" y="${(yy+11).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#717b87">${fmt(r.lo)}</text>`
      +`<text x="${(x(r.hi)+4).toFixed(1)}" y="${(yy+11).toFixed(1)}" font-size="8.5" fill="#717b87">${fmt(r.hi)}</text>`;
  }).join('');
  const lines=refs.map((r,i)=>`<line x1="${x(r.v).toFixed(1)}" y1="${TP-24+i*12}" x2="${x(r.v).toFixed(1)}" y2="${H-BP+4}" stroke="${r.color}" stroke-width="1.4" stroke-dasharray="4 3"/>`
    +`<text x="${x(r.v).toFixed(1)}" y="${TP-28+i*12}" text-anchor="middle" font-size="9" font-weight="600" fill="${r.color}">${r.label}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${ticks}${lines}${bars}</svg>`;
}

  /* -------------------------------------------------------------- compute */
  compute(a){
    const N = 9;                                   // FY27E .. FY35E
    const lin = (v0,vT,i) => v0 + (vT-v0)*(i/N);   // linear fade, i = 0..N
    
    const yrs=[], labels=[];
    let prevMem = H.fy25.memEnd;                   // 2.9m paid members at FY25 close
    let prevRev = H.fy25.rev;

    for(let i=0;i<=N;i++){
      const lbl = 'FY'+(2026+i)+'E'; labels.push(lbl.replace('FY20','FY'));
      // unit growth for year i (i>=1) fades geometrically from unitG27 at i=1 to unitGterm at i=N
      const g = i===0 ? null : a.unitG27*Math.pow(a.unitGterm/a.unitG27, (i-1)/(N-1));
      const u = i===0 ? a.units26 : yrs[i-1].units*(1+g);

      const rpu   = a.rpu26*Math.pow(1+a.rpuDrift, i);
      const hw    = u*rpu;                                     // $m  (m units x $)
      const rep   = Math.min(a.repeat26 + a.repeatDrift*i, 0.35);
      const ret   = Math.min(a.retention + a.retDrift*i, 0.92);
      const newM  = u*(1-rep)*a.convRate;
      const churn = prevMem*(1-ret);
      const memEnd= prevMem*ret + newM;
      const memAvg= (prevMem+memEnd)/2;
      const arpu  = a.arpu26*Math.pow(1+a.arpuG, i);
      const mem   = memAvg*arpu;
      const rev   = hw + mem;

      const hwGM  = lin(a.hwGM26, a.hwGMterm, i);
      const gp    = hw*hwGM + mem*a.memGM;
      const sm    = rev*lin(a.sm26, a.smTerm, i);
      const rd    = rev*lin(a.rd26, a.rdTerm, i);
      const ga    = rev*lin(a.ga26, a.gaTerm, i);
      // historical opex ratios embed ~0.8% of revenue of SBC; step up to a public-company run rate from FY27
      const sbcRate = i===0 ? 0.008 : a.sbcFwd + (a.sbcTerm-a.sbcFwd)*((i-1)/(N-1));
      const sbcInc  = rev*Math.max(0, sbcRate - 0.008);
      const ebit  = gp - sm - rd - ga - sbcInc;
      const da    = rev*a.daPct;
      const ebitda= ebit + da;                                  // SBC treated as a cost, as data providers do
      const adjE  = ebitda + rev*0.008 + sbcInc;                // company definition: add all SBC back
      const capex = rev*a.capexPct;
      const dNWC  = (rev - prevRev)*a.nwcPct;
      const nopat = ebit*(1-a.taxRate);
      const fcf   = nopat + da - capex - dNWC;

      yrs.push({lbl, i, units:u, g, rpu, hw, rep, ret, newM, churn, memEnd, memAvg, arpu, mem, rev,
                hwGM, gp, gm:gp/rev, sm, rd, ga, sbcInc, opex:sm+rd+ga+sbcInc, ebit, ebitM:ebit/rev,
                da, ebitda, ebitdaM:ebitda/rev, adjE, capex, dNWC, nopat, fcf,
                revG: rev/prevRev - 1, memMix: mem/rev});
      prevMem = memEnd; prevRev = rev;
    }

    const y26 = yrs[0], y27 = yrs[1], y29 = yrs[3], yT = yrs[N];

    /* ---- FY26E reconciliation to the 9M actual ---- */
    const q4 = {rev:y26.rev-H.n9m26.rev, hw:y26.hw-H.n9m26.hw, mem:y26.mem-H.n9m26.mem,
                ebit:y26.ebit-H.n9m26.ebit, adjE:y26.adjE-H.n9m26.adjE,
                pyRev:H.fy25.rev-H.n9m25.rev, pyEbit:H.fy25.ebit-H.n9m25.ebit,
                pyAdjE:H.fy25.adjE-H.n9m25.adjE, pyHw:H.fy25.hw-H.n9m25.hw, pyMem:H.fy25.mem-H.n9m25.mem};
    q4.g = q4.rev/q4.pyRev - 1;

    /* ---- DCF: valuation date is FY26 year end, mid-year discounting on FY27-FY35 ---- */
    const dcfAt = w => {
      let pv=0; const rows=[];
      for(let i=1;i<=N;i++){ const df=1/Math.pow(1+w, i-0.5); const p=yrs[i].fcf*df; pv+=p;
        rows.push({lbl:yrs[i].lbl, fcf:yrs[i].fcf, df, pv:p}); }
      const tvG = w>a.tgr ? yT.fcf*(1+a.tgr)/(w-a.tgr) : NaN;
      const tvM = yT.ebitda*a.exitMult;
      const tv  = a.ggWeight*tvG + (1-a.ggWeight)*tvM;
      const dfT = 1/Math.pow(1+w, N);
      const pvTV= tv*dfT;
      const ev  = pv + pvTV;
      return {rows, pvFcf:pv, tvG, tvM, tv, dfT, pvTV, ev, eq:ev-a.netDebt, ps:(ev-a.netDebt)/a.shares,
              tvShare:pvTV/ev};
    };
    const dcf = dcfAt(a.wacc);
    const dcfLo = dcfAt(a.wacc+0.015), dcfHi = dcfAt(Math.max(0.04, a.wacc-0.015));

    /* sensitivity: WACC x terminal growth, implied share price */
    const wRange=[-0.02,-0.01,0,0.01,0.02].map(d=>a.wacc+d);
    const gRange=[-0.01,-0.005,0,0.005,0.01].map(d=>a.tgr+d);
    const sens = wRange.map(w=>gRange.map(gg=>{
      if(w<=gg) return null;
      const tvG=yT.fcf*(1+gg)/(w-gg), tv=a.ggWeight*tvG+(1-a.ggWeight)*yT.ebitda*a.exitMult;
      let pv=0; for(let i=1;i<=N;i++) pv+=yrs[i].fcf/Math.pow(1+w,i-0.5);
      const ev=pv+tv/Math.pow(1+w,N); return (ev-a.netDebt)/a.shares;
    }));

    /* ---- comps ---- */
    const comps = COMPS.map(c=>({...c, evs:c.ev/c.rev, eve:c.ebitda>0?c.ev/c.ebitda:null,
                                 ebitdaM:c.ebitda/c.rev, r40:c.g+c.ebitda/c.rev,
                                 evsPerG: c.g>0? (c.ev/c.rev)/(c.g*100) : null}));
    const med = arr => { const v=arr.filter(x=>x!==null&&isFinite(x)).sort((x,y)=>x-y); if(!v.length) return null;
      const m=Math.floor(v.length/2); return v.length%2?v[m]:(v[m-1]+v[m])/2; };
    const compStats = {
      evs: med(comps.map(c=>c.evs)), eve: med(comps.map(c=>c.eve)),
      g: med(comps.map(c=>c.g)), gm: med(comps.map(c=>c.gm)), em: med(comps.map(c=>c.ebitdaM)),
      evsPerG: med(comps.map(c=>c.evsPerG)), r40: med(comps.map(c=>c.r40)),
    };

    /* Oura's own metrics for the regressions: LTM actual, and FY27E forward */
    const ouraLtm = {rev:H.ttm.rev, ebitda:H.ttm.ebit+H.ttm.da, g:0.74, gm:H.ttm.gm};
    ouraLtm.ebitdaM = ouraLtm.ebitda/ouraLtm.rev;
    ouraLtm.r40 = ouraLtm.g + ouraLtm.ebitdaM;

    /* least-squares through the comp set: EV/Sales on growth, and on the rule-of-40 score */
    const reg = (xs, ys) => { const n=xs.length; const mx=xs.reduce((s,v)=>s+v,0)/n, my=ys.reduce((s,v)=>s+v,0)/n;
      let num=0, den=0; for(let i=0;i<n;i++){ num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2; }
      const b=den? num/den : 0; return {b, a: my-b*mx}; };
    const okG = comps.filter(c=>c.g>0);
    const regG  = reg(okG.map(c=>c.g), okG.map(c=>c.evs));          // slope is NEGATIVE in this set
    const regR  = reg(comps.map(c=>c.r40), comps.map(c=>c.evs));
    const impliedR = Math.max(0, regR.a + regR.b*ouraLtm.r40);
    // growth-adjusted: median EV/Sales per point of revenue growth, applied to Oura's growth
    const impliedG = compStats.evsPerG * (ouraLtm.g*100);
    const evGrowthAdj = impliedG*ouraLtm.rev;
    const evR40       = impliedR*ouraLtm.rev;

    /* ---- football field (EV, $m) ---- */
    const pvBack = v => v/Math.pow(1+a.wacc, 3);   // FY29E multiple back to today
    const field = [
      {label:'DCF (WACC ±1.5 p.p.)',        lo:dcfLo.ev,              hi:dcfHi.ev,              color:'#2563eb'},
      {label:'EV / LTM revenue',            lo:a.mRevLo*H.ttm.rev,    hi:a.mRevHi*H.ttm.rev,    color:'#0f9d8c'},
      {label:'EV / FY27E revenue',          lo:a.mFwdLo*y27.rev,      hi:a.mFwdHi*y27.rev,      color:'#0f9d8c'},
      {label:'EV / FY29E EBITDA (disc.)',   lo:pvBack(a.mEbLo*y29.ebitda), hi:pvBack(a.mEbHi*y29.ebitda), color:'#0f9d8c'},
      {label:'Growth-adjusted EV/Sales',    lo:evGrowthAdj*0.8,       hi:evGrowthAdj*1.2,       color:'#b7791f'},
      {label:'Rule-of-40 regression',       lo:evR40*0.8,             hi:evR40*1.2,             color:'#b7791f'},
      {label:'Precedent: Masimo 6.3x sales',lo:5.3*H.ttm.rev,         hi:7.3*H.ttm.rev,         color:'#7c5cbf'},
    ];
    const fieldLo = Math.min(...field.map(f=>f.lo)), fieldHi = Math.max(...field.map(f=>f.hi));
    const fieldMid = field.reduce((s,f)=>s+(f.lo+f.hi)/2,0)/field.length;

    /* ---- historical unlevered FCF, same definition as the forecast ---- */
    const histFcf = h => { const tax=h.ebit*a.taxRate, nopat=h.ebit-tax;
      return {lbl:h.lbl, rev:h.rev, ebit:h.ebit, ebitM:h.ebit/h.rev, tax, nopat, da:h.da,
              capex:h.capex, dNWC:-h.wcSrc, fcf:nopat+h.da-h.capex+h.wcSrc, actual:true}; };
    const hist = [histFcf(H.fy24), histFcf(H.fy25)];

    /* ---- unit economics ---- */
    const hwGPunit = y26.rpu*y26.hwGM;
    const takeRate = y26.newM/y26.units;                 // rings that end up as a paid subscription
    const cacBlend = (y26.sm*a.smAcqShare)/y26.units;    // per RING sold, matching hardware gross profit
    const cacPaid  = a.organic<1 ? cacBlend/(1-a.organic) : cacBlend;
    const arpuRing = y26.arpu*takeRate;                  // membership ARPU earned per ring sold
    const memGPyr  = arpuRing*a.memGM;
    const life     = 1/(1-a.retention);
    let ltvMem=0; for(let t=0;t<25;t++){ ltvMem += memGPyr*Math.pow(a.retention,t)/Math.pow(1+a.wacc,t+0.5); }
    const repeatHW = hwGPunit*(a.repeat26/(1-a.repeat26))*Math.min(life,8)/8*1.0;
    const ltv      = ltvMem + hwGPunit + repeatHW;
    const ltvCac   = ltv/cacBlend;
    const dayOne   = hwGPunit - cacBlend;

    /* ---- warranty replacement, priced on a hardware-life curve rather than a geometric one ----
       The build above compounds retention for 25 years, which quietly assumes one ring lasts that
       long. It does not. Inside a ring's life members are sticky at the same rate; at hardware
       failure they lapse together unless the ring is replaced. So both warranty columns run
       retention a year to a hard horizon and stop, and the replacement is what moves the horizon
       out. The same curve drives the membership PV and the number of rings that have to be paid
       for, which is the part the geometric version was getting free. */
    const wClaim   = Math.min(1, Math.max(0, a.warrClaim));
    const ringCost = y26.rpu*(1-y26.hwGM);                       // COGS of the ring Oura ships back
    const wFail    = Math.max(1, Math.round(a.warrYr));
    const wHoriz   = Math.max(wFail, Math.round(a.warrLife));
    const cliff = Hz => {                                        // retention a year to Hz, then zero
      let pv=0, yrs=0;
      for(let t=0;t<Hz;t++){ const sv=Math.pow(a.retention,t);
        pv += memGPyr*sv/Math.pow(1+a.wacc,t+0.5); yrs += sv; }
      const rep = hwGPunit*(a.repeat26/(1-a.repeat26))*Math.min(yrs,8)/8;
      return {pv, yrs, rep};
    };
    const warrCalc = (fail, horizon) => {
      const hz    = Math.max(fail, horizon);
      const noRep = cliff(fail), wRep = cliff(hz);
      const alive = Math.pow(a.retention, fail);                 // still paying when the ring dies
      const cost  = ringCost*alive*wClaim/Math.pow(1+a.wacc, fail);
      const ltvNo = noRep.pv + hwGPunit + noRep.rep;
      const ltvRe = wRep.pv  + hwGPunit + wRep.rep - cost;
      return {fail, horizon:hz, alive, cost, noRep, wRep, ltvNo, ltvRe,
              ratioNo:ltvNo/cacBlend, ratioRe:ltvRe/cacBlend};
    };
    const breakEven = f => { const hurdle=warrCalc(f,f).ltvNo; let e=1;
      for(; e<=30; e++) if(warrCalc(f, f+e).ltvRe >= hurdle) break;
      return e>30 ? null : e; };
    const warr = Object.assign(warrCalc(wFail, wHoriz), {beExtra:breakEven(wFail)});
    // extra years the replacement has to buy before it pays for the ring, by failure year
    const warrBE = [1,2,3,4,5].map(f=>{ const c=warrCalc(f,f);
      return {fail:f, extra:breakEven(f), ltvNo:c.ltvNo, ratioNo:c.ratioNo, cost:c.cost,
              alive:Math.pow(a.retention,f)}; });

    // 9M FY26 actuals, built from the filing: RPU and rings sold are disclosed, hardware gross
    // margin is backed out of disclosed gross profit less membership at its disclosed margin, and
    // CAC uses the same S&M-share assumption as the forecast column so the two are comparable.
    const aHwGM  = (H.n9m26.gp - H.n9m26.mem*a.memGM)/H.n9m26.hw;
    const aGP    = H.n9m26.rpu*aHwGM;
    const aCac   = (H.n9m26.sm*a.smAcqShare)/H.n9m26.units;
    const act    = {rpu:H.n9m26.rpu, hwGM:aHwGM, gp:aGP, cac:aCac, dayOne:aGP-aCac,
                    units:H.n9m26.units, sm:H.n9m26.sm};

    return {yrs, labels, y26, y27, y29, yT, N, q4, dcf, dcfLo, dcfHi, sens, wRange, gRange, hist,
            comps, compStats, ouraLtm, regG, regR, impliedG, impliedR, evGrowthAdj, evR40,
            field, fieldLo, fieldHi, fieldMid,
            unit:{act, hwGPunit, takeRate, arpuRing, cacBlend, cacPaid, memGPyr, life, ltvMem, repeatHW, ltv, ltvCac, dayOne,
                  warr, warrBE, warrCalc, ringCost, wClaim},
            H, BS, PRECEDENT};
  },

      <p class="note">The gap between these two is the entire Oura debate in one number. Credit the growth alone and it
      is worth ${mm(r.evGrowthAdj)}. Insist that the current 6% EBITDA margin is a real constraint rather than a choice about
      reinvestment, and it is worth ${mm(r.evR40)}. Everything on this page sits between those poles.</p>
    </div>

    <div class="card"><h3>Precedent transaction</h3>
      ${tbl([
        ['', ['Date','EV','EV/Revenue','EV/EBITDA'], 'hd'],
        [r.PRECEDENT.n, [r.PRECEDENT.date, mm(r.PRECEDENT.ev), r.PRECEDENT.evs.toFixed(1)+'x', r.PRECEDENT.evebitda.toFixed(1)+'x']],
        ['Applied to Oura LTM revenue', ['', mm(r.PRECEDENT.evs*o.rev), r.PRECEDENT.evs.toFixed(1)+'x', ''], 'tot'],
      ])}
      <p class="note">Danaher's takeout of Masimo closed in June 2026 at 6.3x sales and 26.6x EBITDA for a patient-monitoring
      business growing in the high single digits. It is the only clean recent print in adjacent hardware-plus-health, and
      it sets a floor rather than a target: it is a control premium on a slower asset.</p>
    </div>

    <div class="card"><h3>Football field <span class="pill">enterprise value</span></h3>
      ${fieldChart(r.field, [
        {v:11000, label:'Series E mark $11.0B', color:'#9aa3ae'},
        {v:16000, label:'Reported IPO target $16B', color:'#c2410c'},
      ], v=>'$'+(v/1000).toFixed(0)+'B')}
      <p class="note">The Series E in September 2025 priced at $53.57 a share and was reported as an $11bn mark. Oura then
      spent ${mm(741.8)} in FY26 buying back common and preferred, taking the preferred count from 163.6m to 136.8m, so the
      per-share arithmetic on that round does not carry across cleanly.</p>
    </div>

    <div class="card"><h3>Triangulation</h3>
      ${tbl([
        ['', ['Enterprise value','Per share','EV / LTM revenue'], 'hd'],
        ...r.field.map(f=>[f.label, [mm((f.lo+f.hi)/2), d2(psOf((f.lo+f.hi)/2)), ((f.lo+f.hi)/2/o.rev).toFixed(1)+'x']]),
        ['Midpoint of methods', [mm(r.fieldMid), d2(psOf(r.fieldMid)), (r.fieldMid/o.rev).toFixed(1)+'x'], 'tot'],
        ['Reported IPO target', ['&gt;$16.0B', d2(psOf(16000)), (16000/o.rev).toFixed(1)+'x'], 'muted'],
        ['Series E mark, Sep 2025', ['~$11.0B', '', (11000/o.rev).toFixed(1)+'x'], 'muted'],
      ])}
      <p class="note">At the reported $16bn, Oura would list at ${(16000/o.rev).toFixed(1)}x LTM revenue and roughly
      ${(16000/r.y27.rev).toFixed(1)}x FY27E revenue. That is above every comp in the set on a headline basis and defensible only
      on the growth-adjusted view. The bear case for the multiple is not that the business is bad, it is that this comp
      set has repeatedly refused to pay for growth without margin.</p>
    </div>

    <div class="disclaimer">Comparable-company market data is sourced from stockanalysis.com as at 7 September 2026 and is
    indicative rather than a licensed data feed. Enterprise values, LTM revenue, EBITDA and growth are as reported there.
    The Masimo precedent reflects its last trading statistics before the Danaher acquisition closed in June 2026. The
    "reported IPO target" is press reporting (Bloomberg, via Yahoo Finance), not a figure in the S-1: the filing sets no
    price range, offering size or share count.</div>`;
  }, takeaways(r,a){ const o=r.ouraLtm; return [
    `<b>Methods midpoint of ${mm(r.fieldMid)}</b>, or ${d2((r.fieldMid-a.netDebt)/a.shares)} a share. The reported $16bn target sits
     inside the range but above the midpoint.`,
    `<b>The comp set does not pay for growth on its own.</b> Regressed on growth alone the slope is negative. Garmin and
     DexCom get the highest multiples in the set on mid-teens growth and ~30% EBITDA margins.`,
    `<b>So the question is whether Oura's 6% margin is a choice.</b> If reinvestment is genuinely optional the growth-adjusted
     ${mm(r.evGrowthAdj)} is fair. If it is structural, the rule-of-40 read of ${mm(r.evR40)} is closer.`,
    `<b>Hardware mix caps the multiple.</b> ${p0(r.y26.hw/r.y26.rev)} of FY26E revenue is low-margin, non-recurring hardware.
     Membership crossing half of revenue is what would re-rate this toward a software multiple, and that is FY34E in the base case.`,
    `<b>Watch the share count, not just the valuation.</b> Every share figure in the S-1 is blank. At ${a.shares.toFixed(0)}m diluted
     the midpoint is ${d2((r.fieldMid-a.netDebt)/a.shares)}; the count moves at pricing and the SAFE is unsized.`,
  ];}},

  ],
};
MODELS[OURA.id]=OURA; ACTIVE_COMPANY=OURA.id;

// ===== END MODEL =====

/* ============================================================ RENDER HELPERS ============================================================ */
function kpiRow(items){ return `<div class="kpis">${items.map(k=>`<div class="kpi"><div class="k">${k[0]}</div><div class="v num">${k[1]}</div><div class="s">${k[2]||''}</div></div>`).join('')}</div>`; }
function wonAll(t){ return int(t.wonAll)+' of '+int(t.pool)+' wins'; }
function table(rows){
  return '<table class="t">'+rows.map(r=>{
    const cls=r[2]?(' class="'+r[2]+'"'):''; const cells=[`<td>${r[0]}</td>`].concat(r[1].map(c=>`<td>${c}</td>`));
    return `<tr${cls}>${cells.join('')}</tr>`;
  }).join('')+'</table>';
}
function barH(items, fmt){ const max=Math.max(...items.map(i=>i.value),0.0001);
  return `<div class="bars">${items.map(i=>`<div class="bar-row"><span class="bar-label">${i.label}</span><div class="bar-track"><div class="bar-fill" style="width:${(i.value/max*100).toFixed(1)}%;background:${i.color}"></div></div><span class="bar-val">${fmt(i.value)}</span></div>`).join('')}</div>`; }
function lineChart(series, n, single){
  const W=560,H=190,P=42,RP=12,TP=12,BP=24;
  const all=series.flatMap(s=>s.data); let max=Math.max(...all,0), min=Math.min(...all,0);
  if(max===min) max=min+1; const span=max-min;
  const x=i=>P+i*(W-P-RP)/(n-1), y=v=>TP+(H-TP-BP)-((v-min)/span)*(H-TP-BP);
  const grid=[max,(max+min)/2,min].map(v=>`<line x1="${P}" y1="${y(v).toFixed(1)}" x2="${W-RP}" y2="${y(v).toFixed(1)}" stroke="#eef1f5"/><text x="${P-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#9aa3ae">${money(v)}</text>`).join('');
  const zero = (min<0&&max>0)?`<line x1="${P}" y1="${y(0).toFixed(1)}" x2="${W-RP}" y2="${y(0).toFixed(1)}" stroke="#cbd2da" stroke-dasharray="3 3"/>`:'';
  const lines=series.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${s.data.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>`).join('');
  const xl=[0,5,11,17,23].map(i=>`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="#9aa3ae">M${i+1}</text>`).join('');
  const leg=`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${grid}${zero}${lines}${xl}</svg>${single?'':leg}`;
}

/* ============================================================ APP STATE ============================================================ */
let MODEL = MODELS[ACTIVE_COMPANY];
let activeTab = MODEL.tabs[0].id;
/* ---- store: three scenarios, each with a working (live) + saved (revert point) copy ---- */
const STORE_KEY = () => 'fd_'+MODEL.id+'_v2';
const SCENARIOS = ['base','bull','bear'];
function templateFor(scn){ return scn==='base' ? Object.assign({}, MODEL.defaults) : Object.assign({}, MODEL.defaults, MODEL.presets[scn]||{}); }
function freshStore(){ const s={active:'base',scenarios:{}}; SCENARIOS.forEach(scn=>{const t=templateFor(scn);s.scenarios[scn]={working:Object.assign({},t),saved:Object.assign({},t)};}); return s; }
function loadStore(){
  try{ const raw=localStorage.getItem(STORE_KEY()); if(!raw) return freshStore();
    const s=JSON.parse(raw); if(!s||!s.scenarios) return freshStore();
    SCENARIOS.forEach(scn=>{ const t=templateFor(scn);
      if(!s.scenarios[scn]) s.scenarios[scn]={working:Object.assign({},t),saved:Object.assign({},t)};
      s.scenarios[scn].working=Object.assign({}, t, s.scenarios[scn].working||{});
      s.scenarios[scn].saved  =Object.assign({}, t, s.scenarios[scn].saved||{});
    });
    if(!SCENARIOS.includes(s.active)) s.active='base'; return s;
  }catch(e){ return freshStore(); }
}
function saveStore(){ localStorage.setItem(STORE_KEY(), JSON.stringify(store)); }
let store = loadStore();
let state = store.scenarios[store.active].working;
const curScn = () => store.scenarios[store.active];

function fmtVal(inp, v){ return inp.type==='pct' ? (Math.round(v*1000)/10) : v; }
function parseVal(inp, raw){ const n=parseFloat(raw); if(isNaN(n)) return state[inp.id]; return inp.type==='pct' ? n/100 : n; }
function unitOf(inp){ if(inp.unit) return inp.unit; if(inp.type==='pct') return '%'; if(inp.type==='money') return '$'; return ''; }

/* ---- assumption rationale: click/focus an input to reveal its description, double-click to edit ---- */
function ratKey(){ return 'fd_rat_'+MODEL.id; }
function loadRats(){ try{ return JSON.parse(localStorage.getItem(ratKey()))||{}; }catch(e){ return {}; } }
function ratText(id){ const r=loadRats(); if(id in r) return r[id]; const inp=findInput(id); if(inp&&inp.note) return inp.note; return (MODEL.notes&&MODEL.notes[id])||''; }
function setRat(id,txt){ const r=loadRats(); r[id]=txt; localStorage.setItem(ratKey(), JSON.stringify(r)); }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderRat(id){ const el=document.querySelector('[data-ratbody="'+id+'"]'); if(!el) return; const t=ratText(id);
  el.innerHTML=(t?escHtml(t):'<span class="empty">No rationale yet.</span>')+'<span class="edit-hint">Double-click to edit</span>'; }
function showRat(id){ const b=document.querySelector('[data-ratbody="'+id+'"]'); if(!b||b.classList.contains('show')) return;
  b.classList.add('show'); const ic=document.querySelector('.info[data-rat="'+id+'"]'); if(ic) ic.classList.add('on'); renderRat(id); }
function toggleRat(id){ const b=document.querySelector('[data-ratbody="'+id+'"]'); const ic=document.querySelector('.info[data-rat="'+id+'"]');
  const show=b.classList.toggle('show'); if(ic) ic.classList.toggle('on',show); if(show) renderRat(id); }
function editRat(id){ const el=document.querySelector('[data-ratbody="'+id+'"]'); if(!el) return; const t=ratText(id);
  el.innerHTML='<textarea>'+escHtml(t)+'</textarea>'; const ta=el.querySelector('textarea'); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
  let done=false;
  const commit=()=>{ if(done) return; done=true; setRat(id, ta.value.trim()); setTimeout(()=>renderRat(id),0); };
  ta.addEventListener('blur', commit);
  ta.addEventListener('keydown', e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) ta.blur(); else if(e.key==='Escape'){ done=true; setTimeout(()=>renderRat(id),0); } }); }

function buildInputs(){
  const root=document.getElementById('inputs'); root.innerHTML='';
  MODEL.groups.forEach(g=>{
    const det=document.createElement('details'); det.className='grp'+(g.tabs.includes(activeTab)?' relevant':'');
    det.open=g.tabs.includes(activeTab); det.dataset.tabs=g.tabs.join(',');
    const inputs=g.inputs.map(inp=>`<div class="inp"><div class="lab"><label>${inp.label}</label><span class="info" data-rat="${inp.id}" title="Description & rationale">i</span></div><div class="inwrap"><input type="number" step="${inp.step}" data-id="${inp.id}" value="${fmtVal(inp,state[inp.id])}"><span class="unit">${unitOf(inp)}</span></div><div class="rat" data-ratbody="${inp.id}"></div></div>`).join('');
    det.innerHTML=`<summary><span class="chev">▶</span>${g.label}<span class="rel"></span></summary><div class="grp-body">${inputs}</div>`;
    root.appendChild(det);
  });
  root.querySelectorAll('input[data-id]').forEach(el=>{
    const inp=findInput(el.dataset.id);
    el.addEventListener('input',()=>{ state[inp.id]=parseVal(inp, el.value); saveStore(); renderBody(); updateDirty(); });
    el.addEventListener('focus',()=>showRat(inp.id));
  });
  root.querySelectorAll('.info[data-rat]').forEach(ic=>ic.addEventListener('click',()=>toggleRat(ic.dataset.rat)));
  root.querySelectorAll('.rat[data-ratbody]').forEach(b=>b.addEventListener('dblclick',()=>editRat(b.dataset.ratbody)));
}
function findInput(id){ for(const g of MODEL.groups){ const f=g.inputs.find(i=>i.id===id); if(f) return f; } }

function buildTabs(){
  const bar=document.getElementById('tabbar'); bar.innerHTML='';
  MODEL.tabs.forEach(t=>{ const b=document.createElement('button'); b.className='tab'+(t.id===activeTab?' active':''); b.textContent=t.label;
    b.onclick=()=>{ activeTab=t.id; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); b.classList.add('active');
      document.querySelectorAll('details.grp').forEach(d=>{ const rel=d.dataset.tabs.split(',').includes(activeTab); d.classList.toggle('relevant',rel); d.open=rel; });
      renderBody(); loadNotes(); };
    bar.appendChild(b); });
}

function renderBody(){
  const res=MODEL.compute(state);
  const tab=MODEL.tabs.find(t=>t.id===activeTab);
  document.getElementById('body').innerHTML=tab.render(res,state);
  const tk=tab.takeaways(res,state);
  document.getElementById('takeaways').innerHTML='<ul>'+tk.map(t=>`<li>${t}</li>`).join('')+'</ul>';
  document.getElementById('notesHead').textContent='Notes — '+tab.label;
}

/* notes persistence */
function notesKey(){ return 'fd_notes_'+MODEL.id+'_'+activeTab; }
function loadNotes(){ document.getElementById('notes').value = localStorage.getItem(notesKey())||''; }
document.getElementById('notes').addEventListener('input', e=>{
  localStorage.setItem(notesKey(), e.target.value);
  const s=document.getElementById('saved'); s.classList.add('show'); clearTimeout(window._st); window._st=setTimeout(()=>s.classList.remove('show'),900);
});

/* ----- scenarios: three independent persisted models, each with a working + saved (revert) copy ----- */
const SCN_LABEL={base:'Base',bull:'Bull',bear:'Bear'};
function switchScenario(scn){
  if(scn===store.active) return;
  store.active=scn; state=store.scenarios[scn].working; saveStore();
  syncScnButtons(); buildInputs(); renderBody(); updateDirty();
}
function saveDown(){ const s=curScn(); s.saved=JSON.parse(JSON.stringify(s.working)); saveStore(); updateDirty(); }
function revert(){ const s=curScn(); s.working=JSON.parse(JSON.stringify(s.saved)); state=s.working; saveStore(); buildInputs(); renderBody(); updateDirty(); }
function resetTemplate(){
  if(!confirm('Reset '+SCN_LABEL[store.active]+' to its template defaults? Your saved revert point is kept.')) return;
  const s=curScn(); s.working=templateFor(store.active); state=s.working; saveStore(); buildInputs(); renderBody(); updateDirty();
}
function isDirty(){ const s=curScn(); return JSON.stringify(s.working)!==JSON.stringify(s.saved); }
function updateDirty(){
  const d=isDirty();
  const dot=document.getElementById('dirty'); if(dot){ dot.className='dirty '+(d?'on':'off'); dot.textContent=d?'● Edited (unsaved)':'● Saved'; }
  const r=document.getElementById('btnRevert'), sv=document.getElementById('btnSave'); if(r) r.disabled=!d; if(sv) sv.disabled=!d;
}
function syncScnButtons(){ document.querySelectorAll('#scnsel button').forEach(b=>b.classList.toggle('active', b.dataset.scn===store.active)); }
function buildScenarioBar(){
  document.querySelectorAll('#scnsel button').forEach(b=> b.onclick=()=>switchScenario(b.dataset.scn));
  document.getElementById('btnSave').onclick=saveDown;
  document.getElementById('btnRevert').onclick=revert;
  document.getElementById('btnReset').onclick=resetTemplate;
  syncScnButtons(); updateDirty();
}

/* boot */
document.getElementById('company').innerHTML='<option>'+MODEL.name+'</option>';
buildScenarioBar(); buildTabs(); buildInputs(); renderBody(); loadNotes();
</script>
</body>
